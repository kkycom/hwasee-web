name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 코드 push 없이도 시간에 따라 콘텐츠가 바뀌는 것들(훔쳐본 일기장 매주 수요일
  # 공개, hot 랭킹, 세 단어 챌린지 마감 등)이 우연히 push가 없는 날엔 정적
  # 페이지에 며칠씩 늦게 반영되던 간극을 메우려고 매일 1회 자동 재빌드 추가
  # (2026-08-25). 시각은 한국 기준 새벽 시간대(UTC 21:00 = KST 06:00)로 잡아서
  # 트래픽 낮은 시간에 돎.
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # 완결된 이야기를 정적 페이지(bang/story/{id}/index.html)로 미리 생성 —
      # 애드센스 저가치콘텐츠 반려 대응. 신규 기능이라 이 스텝이 실패해도
      # (예: 시크릿 미등록) 사이트 전체 배포까지 막지 않게 continue-on-error.
      # English 에디션 발행 — 승인되고 원문 해시가 일치하는 완결작만 영어 정적
      # 페이지로 만든다. 한국어 SSG보다 **먼저** 돌아야 한다: 이 스텝이 남기는
      # .en-manifest.json을 한국어 빌드가 읽어 상호 hreflang을 붙이기 때문
      # (양쪽이 같은 판정을 써야 한쪽만 걸리는 일방향 hreflang이 안 생긴다).
      - name: Build English story pages
        run: node scripts/build-en-pages.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true
      - name: Build static story pages
        run: node scripts/build-static-stories.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true
      # 위 빌드 스텝은 인프라 문제(시크릿 미등록 등)로 실패해도 사이트 전체
      # 배포는 막지 않으려고 continue-on-error를 켜뒀는데, 그 결과 빌드가
      # "성공은 했지만 내용이 이상한"(예: 애드센스 6차 반려 원인이었던
      # 온보딩 텍스트 중복류 문제) 경우를 걸러줄 장치가 없었음. 이 스텝은
      # 반대로 continue-on-error 없이 둬서, 실제로 이상한 정적 페이지가
      # 생성되면 여기서 배포 자체를 막음(bang/story/ 디렉터리가 아예 없는
      # 경우, 즉 위 빌드가 통째로 스킵된 경우는 검사 대상 없음으로 보고
      # 통과시킴 — 스크립트 자체 안에서 처리).
      - name: Verify static story pages
        run: node scripts/verify-static-stories.js
      # 영어 발행 검증도 continue-on-error 없이 fail-closed — 미승인/스테일 노출,
      # canonical·hreflang 불일치, sitemap 수 불일치가 있으면 배포를 멈춘다.
      # (멈추면 새 배포가 안 올라갈 뿐, 이전 라이브 버전은 그대로 유지된다.)
      - name: Verify English story pages
        run: node scripts/verify-en-pages.js
        env:
          EN_BUILD_REQUIRED: '1'
      # upload-pages-artifact는 .gitignore를 안 보고 이 시점의 디스크 내용을
      # 그대로 올림 — npm ci로 생긴 node_modules(빌드 전용, firebase-admin
      # 의존성 트리)가 그대로 라이브 사이트에 배포되고 있었음(디버그방 발견,
      # curl로 https://hwasee.me/node_modules/... 200 확인). 빌드 산출물이
      # 아닌 빌드 도구 자체는 배포 전에 제거.
      - name: Remove build-only files before deploy
        run: rm -rf node_modules package.json package-lock.json scripts .en-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry deploy (1)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 20
      - name: Retry deploy (2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
