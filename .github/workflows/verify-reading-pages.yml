name: Verify reading pages (no deploy)

# 독립 독서 페이지(renderStoryPageV2) 시범을 운영 배포 없이 검증만 하기 위한
# 워크플로우. deploy.yml의 빌드·검사 스텝만 재사용하고 Pages/Firebase 배포
# 스텝(upload-pages-artifact / deploy-pages)은 넣지 않는다.
# 자동 실행은 reading-page-redesign 브랜치로만 좁힌다.

on:
  push:
    branches: [reading-page-redesign, reading-page-v2-expand]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-reading-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # deploy.yml과 동일한 순서·명령. build-en이 남기는 .en-manifest.json을
      # 한국어 빌드가 읽어 상호 hreflang을 붙이므로 en 빌드가 먼저 돈다.
      # 여기서는 검증이 목적이라 continue-on-error 없이 fail-closed.
      - name: Build English story pages
        run: node scripts/build-en-pages.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Build static story pages
        run: node scripts/build-static-stories.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # 검증 전용 사이드카: 이번 빌드가 본 완결작 데이터를 그대로 덤프.
          # 운영 deploy.yml은 이 env가 없어 파일을 만들지 않는다(출력 불변).
          READING_PILOT_EXPECTED_OUT: reading-pilot-expected.json

      - name: Verify static story pages
        run: node scripts/verify-static-stories.js
      - name: Verify English story pages
        run: node scripts/verify-en-pages.js
        env:
          EN_BUILD_REQUIRED: '1'

      # 시범 2편 + 분기 작품의 실제 생성 결과 요약(승인 판단용).
      - name: Summarize pilot output
        if: always()
        run: node scripts/summarize-reading-pilot.js
        env:
          READING_PILOT_EXPECTED_OUT: reading-pilot-expected.json

      # 아티팩트에는 검증에 필요한 공개 산출물만. 작업 폴더 전체(node_modules·
      # scripts·시크릿 경유물)는 올리지 않는다. FIREBASE_SERVICE_ACCOUNT는 build
      # 스텝 env로만 쓰이고 아래 경로에는 포함되지 않는다.
      - name: Upload public build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-pages-output
          path: |
            bang/story/078b460e-d9d0-4642-b75d-44571637f787/index.html
            bang/story/0a400be4-cd2a-4e74-ba79-b677251c9487/index.html
            bang/sitemap.xml
            reading-pilot-summary.md
            reading-pilot-expected.json
          if-no-files-found: warn
          retention-days: 7
